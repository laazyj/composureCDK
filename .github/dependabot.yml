version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk"
          - "aws-cdk*"
          - "@aws-cdk/*"
      nx:
        patterns:
          - "nx"
          - "@nx/*"
      # vitest and its companion packages (@vitest/coverage-v8, @vitest/ui, …)
      # declare peer dependencies on each other, so a split bump leaves the tree
      # holding two majors at once: coverage-v8@4 pinned a nested vitest@4 beside
      # every package's vitest@5. Group them so the majors always move together.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "aws-cdk"
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "nx"
          - "@nx/*"
          - "vitest"
          - "@vitest/*"
