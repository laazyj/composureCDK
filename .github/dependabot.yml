version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 4.0.5 added `"type": "module"` but still ships .d.ts files whose relative
      # imports carry no extension, so under NodeNext every graphlib type fails
      # to resolve and core/src/compose.ts drowns in `no-unsafe-*` (tsc itself
      # passes — skipLibCheck hides it). dagrejs/graphlib#238; fix in
      # dagrejs/graphlib#239, still open.
      #
      # Pinned to the exact bad release, NOT a range: 4.0.6 will be proposed
      # automatically, and CI on that PR is what tells us the fix shipped.
      - dependency-name: "@dagrejs/graphlib"
        versions: ["4.0.5"]
      # typescript-eslint cannot run on TS 7: the parser's peer range is
      # `>=4.8.4 <6.1.0` and the package hard-throws on the TS 7 API, so a TS 7
      # bump fails `npm install` in the cdk-floors matrix and eslint everywhere
      # else. typescript-eslint/typescript-eslint#10940 tracks support for
      # TS >= 7.1. Unlike the graphlib pin above this has no automatic expiry —
      # delete it once that issue closes.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk"
          - "aws-cdk*"
          - "@aws-cdk/*"
      nx:
        patterns:
          - "nx"
          - "@nx/*"
      # vitest and its companion packages (@vitest/coverage-v8, @vitest/ui, …)
      # declare peer dependencies on each other, so a split bump leaves the tree
      # holding two majors at once: coverage-v8@4 pinned a nested vitest@4 beside
      # every package's vitest@5. Group them so the majors always move together.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # These break as one, because they are coupled by peer ranges: typescript
      # majors are gated on typescript-eslint supporting them, and a
      # typescript-eslint minor can add a rule that fails the whole repo. Kept
      # out of the catch-all so a toolchain bump needing code changes does not
      # hold back the routine updates it was grouped with — which is what
      # happened in #458. `prettier` is deliberately NOT here: it has no peer
      # dependencies, so it shares none of this coupling and stays in the
      # catch-all where a patch bump can land on its own.
      toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "@eslint-community/*"
          - "eslint-config-prettier"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "aws-cdk"
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "nx"
          - "@nx/*"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "@eslint-community/*"
          - "eslint-config-prettier"
