name: Blocked label

on:
  pull_request:
    # No base-branch filter, for the same reason as ci.yml: a stacked PR must
    # still get this check. See docs/ci.md#stacked-pull-requests.
    types: [opened, labeled, unlabeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  blocked:
    name: Not blocked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if 'blocked' label is present
        if: contains(github.event.pull_request.labels.*.name, 'blocked')
        run: |
          echo "::error::This PR carries the 'blocked' label and cannot be merged. Remove the label to unblock."
          exit 1
