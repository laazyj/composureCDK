name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: it matches the base, so a stacked PR got no checks.
  # See docs/ci.md#stacked-pull-requests.
  pull_request:
  workflow_call:
    # Both inputs default to the full run, so `push`/`pull_request` are
    # unaffected — those events carry no inputs at all, and the expressions
    # below fall back accordingly. Only a caller that opts out gets less.
    inputs:
      node-versions:
        description: "JSON array of Node major versions to run the matrix on."
        required: false
        default: "[20, 22, 24, 26]"
        type: string
      skip-cdk-floors:
        # Phrased as a skip, not a run, deliberately. On a push or
        # pull_request every input is unset, and GitHub expressions coerce an
        # unset input to false — so false has to be the value that means "do
        # the normal thing".
        description: "Skip the aws-cdk-lib floor-enforcement shards."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Format, Typecheck, Test, Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: false
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is the supported floor; 24 is current LTS; 26 is next.
        # Dual-published packages must resolve on all — see ADR-0007.
        node-version: ${{ fromJSON(inputs.node-versions || '[20, 22, 24, 26]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # package.json requires npm >= 11; Node 20/22 ship npm 10.
      - name: Pin npm
        run: npm install -g npm@11

      # vitest and lint-staged need Node >= 22, which engine-strict enforces. The
      # Node 20 leg proves the published packages' runtime support, not the dev
      # toolchain's, so it installs with a warning instead.
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_engine_strict: ${{ matrix.node-version != 20 }}

      # nx replays a task whose inputs hash to a cached entry, so this turns an
      # unchanged package into a restore instead of a rebuild. Correctness rests
      # on the hash, not on this key: `sharedGlobals` carries a `node --version`
      # runtime input, so a result produced on another Node major can never be
      # replayed here. The key is per-leg anyway, so the legs do not race to
      # save, and `github.sha` makes every run write a fresh entry rather than
      # skipping the save on a key that already exists.
      - name: Restore nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Check formatting
        run: npx nx prettier:check

      # `verify` and the steps below are two lists of the same gates. This
      # fails if a gate is added to `verify` with no step here — which is how
      # `catalogue:check` came to be enforced only at push time. It checks a
      # step exists, not that it runs: a step guarded by an `if:` still counts.
      - name: Check CI covers every verify gate
        run: npx nx ci:covers-verify

      # Workflow linting is Node-independent, so one leg is enough. Keyed to the
      # matrix's first entry rather than a literal version: `[0]` always selects
      # exactly one leg whatever `node-versions` holds, whereas `== 24` matches
      # nothing the moment 24 leaves the matrix — silently dropping the gate,
      # which is the failure mode this whole check exists to prevent.
      #
      # Kept early so a malformed workflow fails the job in seconds. `nx verify`
      # has no such ordering — its gates are one unordered graph, so CI is where
      # cheap-gate-first lives. This is also the only pre-merge signal
      # for workflow changes that cannot test themselves: `workflow_run`
      # listeners always dispatch the default-branch copy, and an edited trigger
      # is not exercised until it next fires.
      - name: Lint workflows
        if: matrix.node-version == fromJSON(inputs.node-versions || '[20, 22, 24, 26]')[0]
        run: npx nx actionlint

      - name: Typecheck
        run: npx nx run-many -t typecheck

      - name: Build
        run: npx nx run-many -t build

      # Both need Build first: one imports each package's `dist`, the other
      # asserts every `files` entry exists — and `files` lists `dist`.
      - name: Check constraint catalogue in sync
        run: npx nx catalogue:check

      - name: Check every published package ships what it declares
        run: npx nx licenses:check

      - name: Check exports
        run: npx nx run-many -t check:exports

      - name: Lint
        run: npx nx run-many -t lint

      # Cheap gate: each package's peerDependencies.aws-cdk-lib must match the
      # cdk-floors.json manifest (ADR-0008).
      - name: Check CDK floor ranges in sync
        run: npx nx cdk-floors:check

      # Cheap gate: every CDK feature flag for a service we wrap carries a
      # decision in cdk-flags.json, and the adopted ones match the examples'
      # cdk.json. Fails when a CDK upgrade ships a flag nobody has triaged.
      - name: Check CDK feature flags reviewed
        run: npx nx cdk-flags:check

      # Synthesises the example stacks once and fails on any CloudFormation
      # Validate finding. Same step `npx nx verify` runs locally, so this
      # should only ever fire for something that skipped the pre-push hook.
      - name: Validate example stacks
        run: npx nx run-many -t validate

      # id: test — the coverage steps below key off whether this actually ran.
      - name: Test
        id: test
        run: npx nx run-many -t test

      # Self-contained coverage reporting (no external service): merge every
      # package's json-summary output into one markdown table
      # (scripts/coverage-summary.mjs) and publish it to the Actions run summary.
      # The per-file thresholds in each vitest.config.ts already gate coverage
      # during the Test step above; these steps only surface the numbers to
      # reviewers. See docs/ci.md#coverage-reporting.
      #
      # This rides along on the Node 24 leg rather than a sibling job. A separate
      # job had to re-run the whole build -> typecheck -> test chain this leg has
      # already run, for identical output — ~3.5 min of duplicated wall-clock per
      # CI run. Coverage (v8, json-summary reporter) is always on via
      # vitest.config.base, so the table is a by-product of the Test step.
      #
      # The sticky PR comment is posted by coverage-comment.yml, not here: this
      # workflow is workflow_call-able from deploy-test.yml, and a job requesting
      # `pull-requests: write` fails validation under that caller's narrower
      # permission ceiling — even when the posting step could never run.
      #
      # if: always() — a threshold miss fails Test but reviewers still want the
      # table showing which package dipped. The guard on Test's conclusion is
      # what always() costs us here: only a Test that ran to completion (pass
      # or fail) leaves coverage-summary.json files to merge. An earlier failure
      # (typecheck, lint) skips Test, and a newer push cancels it mid-run; in
      # both cases these steps must stay quiet rather than fail a second time
      # on the same root cause.
      #
      # id: coverage — the PR-number and upload steps key off this succeeding,
      # so the artifact never ships without the table the comment posts.
      - name: Build coverage summary
        id: coverage
        if: always() && matrix.node-version == 24 && (steps.test.conclusion == 'success' || steps.test.conclusion == 'failure')
        run: npx nx coverage:summary

      # The workflow_run listener has no access to this run's PR context, so the
      # number travels with the artifact.
      - name: Record PR number
        if: always() && steps.coverage.outcome == 'success' && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p coverage
          printf '%s' "$PR_NUMBER" > coverage/pr-number.txt

      - name: Upload coverage summary
        if: always() && steps.coverage.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.md
            coverage/pr-number.txt
          if-no-files-found: error
          retention-days: 1

  # Derive the distinct floors from cdk-floors.json so the enforce matrix
  # stays in sync without duplicating values in YAML.
  cdk-floors-list:
    name: List CDK floors
    # Skipping this skips cdk-floors-enforce with it, via `needs`.
    if: ${{ !inputs.skip-cdk-floors }}
    runs-on: ubuntu-latest
    outputs:
      floors: ${{ steps.read.outputs.floors }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Read distinct floors from manifest
        id: read
        run: |
          # The single quotes below are load-bearing: they hand the script to
          # node unexpanded. Double quotes would let the shell substitute the
          # `${pkg}` / `${e.floor}` JS template placeholders before node sees them.
          # shellcheck disable=SC2016
          node -e '
            const m = JSON.parse(require("node:fs").readFileSync("cdk-floors.json", "utf8")).floors;
            const rows = Object.entries(m)
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([pkg, e]) => `  ${pkg.padEnd(16)} ${e.floor}  (${e.gatedBy})`)
              .join("\n");
            const floors = [...new Set(Object.values(m).map((e) => e.floor))];
            console.log("Per-package aws-cdk-lib floors (cdk-floors.json):\n" + rows);
            console.log("\nDistinct floors -> enforce matrix shards: " + JSON.stringify(floors));
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "floors=" + JSON.stringify(floors) + "\n");
          '

  # For each declared floor, pin aws-cdk-lib to it (npm overrides, clean install)
  # and run that floor's package group's unit suite against it. The suites
  # synthesise builders + policies via partial-matcher assertions, so this
  # catches both import-time (missing named export) and runtime (calling a
  # too-new method, e.g. the #146 Aspect call) version-gated APIs. One floor per
  # shard; the shard's fresh checkout is the clean tree the override needs.
  cdk-floors-enforce:
    name: Enforce aws-cdk-lib@${{ matrix.floor }}
    needs: cdk-floors-list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: false
      CDK_FLOORS_FLOOR: ${{ matrix.floor }}
    strategy:
      fail-fast: false
      matrix:
        floor: ${{ fromJSON(needs.cdk-floors-list.outputs.floors) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # No `npm ci` — enforce does the floor-pinned install itself, and the
      # fresh checkout is the clean tree the npm override requires. That is also
      # why this calls the script directly rather than `nx cdk-floors:enforce`:
      # nx cannot run before its own node_modules exist.
      - name: Enforce
        run: node scripts/cdk-floors.mjs enforce
