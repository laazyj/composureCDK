name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: it matches the base, so a stacked PR got no checks.
  # See docs/ci.md#stacked-pull-requests.
  pull_request:
  # Weekly, to surface drift when nothing merges; see docs/ci.md.
  schedule:
    - cron: "17 5 * * 1"
  workflow_call:
    inputs:
      # Phrased so that unset means the full run: `push` and `pull_request`
      # carry no inputs, and GitHub expressions coerce an unset one to false.
      pre-deploy:
        description: "Run only what a pre-deploy check needs: Workflows and Verify."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # The event is part of the group so a scheduled run on `main` cannot cancel a
  # push run there, which would leave that commit's CI check red.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks on the workflows themselves, as their own job so a workflow
  # problem shows as **Workflows** failing.
  # See docs/ci.md#linting-the-workflows.
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NX_DAEMON: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `verify` and ci.yml are two lists of the same gates. This fails if a
      # gate is added to `verify` with no step in ci.yml — which is how
      # `catalogue:check` came to be enforced only at push time — or if a job
      # is missing from the CI job's `needs`.
      - name: Check CI covers every verify gate
        run: npx nx ci:covers-verify

      - name: Lint workflows
        run: npx nx actionlint

      # Hash-pinned in .github/zizmor/requirements.txt, which Dependabot keeps
      # current; see docs/ci.md#auditing-the-workflows. A venv because the
      # runner's system Python refuses pip installs (PEP 668).
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --disable-pip-version-check --require-hashes --no-deps -r .github/zizmor/requirements.txt
          echo "$RUNNER_TEMP/zizmor/bin" >> "$GITHUB_PATH"

      # GH_TOKEN turns on zizmor's online audits.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx nx zizmor

  # Pull requests only, since it compares base and head; see
  # docs/ci.md#dependency-review.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Development too: nearly every dependency here is one, and runs in CI.
          fail-on-scopes: runtime, development

  # The `verify` gates other than the workflow checks, on the Node the dev
  # toolchain is developed against.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx nx prettier:check

      - name: Typecheck
        run: npx nx run-many -t typecheck

      - name: Build
        run: npx nx run-many -t build

      # Both need Build first: one imports each package's `dist`, the other
      # asserts every `files` entry exists — and `files` lists `dist`.
      - name: Check constraint catalogue in sync
        run: npx nx catalogue:check

      - name: Check every published package ships what it declares
        run: npx nx licenses:check

      - name: Check exports
        run: npx nx run-many -t check:exports

      - name: Lint
        run: npx nx run-many -t lint

      # Cheap gate: each package's peerDependencies.aws-cdk-lib must match the
      # cdk-floors.json manifest (ADR-0008).
      - name: Check CDK floor ranges in sync
        run: npx nx cdk-floors:check

      # Cheap gate: every CDK feature flag for a service we wrap carries a
      # decision in cdk-flags.json, and the adopted ones match the examples'
      # cdk.json. Fails when a CDK upgrade ships a flag nobody has triaged.
      - name: Check CDK feature flags reviewed
        run: npx nx cdk-flags:check

      # Synthesises the example stacks once and fails on any CloudFormation
      # Validate finding. Same step `npx nx verify` runs locally, so this
      # should only ever fire for something that skipped the pre-push hook.
      - name: Validate example stacks
        run: npx nx run-many -t validate

      # id: test — the coverage steps below key off whether this actually ran.
      - name: Test
        id: test
        run: npx nx run-many -t test

      # Self-contained coverage reporting (no external service): merge every
      # package's json-summary output into one markdown table
      # (scripts/coverage-summary.mjs) and publish it to the Actions run summary.
      # The per-file thresholds in each vitest.config.ts already gate coverage
      # during the Test step above; these steps only surface the numbers to
      # reviewers. See docs/ci.md#coverage-reporting.
      # Coverage (v8, json-summary reporter) is always on via
      # vitest.config.base, so the table is a by-product of the Test step.
      #
      # The sticky PR comment is posted by coverage-comment.yml, not here: this
      # workflow is workflow_call-able from deploy-test.yml, and a job requesting
      # `pull-requests: write` fails validation under that caller's narrower
      # permission ceiling — even when the posting step could never run.
      #
      # if: always() — a threshold miss fails Test but reviewers still want the
      # table showing which package dipped. The guard on Test's conclusion is
      # what always() costs us here: only a Test that ran to completion (pass
      # or fail) leaves coverage-summary.json files to merge. An earlier failure
      # (typecheck, lint) skips Test, and a newer push cancels it mid-run; in
      # both cases these steps must stay quiet rather than fail a second time
      # on the same root cause.
      #
      # id: coverage — the PR-number and upload steps key off this succeeding,
      # so the artifact never ships without the table the comment posts.
      - name: Build coverage summary
        id: coverage
        if: always() && (steps.test.conclusion == 'success' || steps.test.conclusion == 'failure')
        run: npx nx coverage:summary

      # The workflow_run listener has no access to this run's PR context, so the
      # number travels with the artifact.
      - name: Record PR number
        if: always() && steps.coverage.outcome == 'success' && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p coverage
          printf '%s' "$PR_NUMBER" > coverage/pr-number.txt

      - name: Upload coverage summary
        if: always() && steps.coverage.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.md
            coverage/pr-number.txt
          if-no-files-found: error
          retention-days: 1

  # Packs every publishable package, as `npm publish` would, for the Consumer
  # jobs to install. See docs/ci.md#consumer-compatibility.
  package:
    name: Package
    if: ${{ !inputs.pre-deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and pack
        run: npx nx consumer:pack

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/consumer
          if-no-files-found: error
          retention-days: 1

  # Installs the packed packages into a fresh project on each supported Node
  # and loads them as a consumer would: no workspace, no dev toolchain, peers
  # checked strictly. See docs/ci.md#consumer-compatibility.
  consumer:
    name: Consumer (Node ${{ matrix.node-version }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist/consumer

      # Called directly rather than through nx: this job installs none of the
      # workspace, which is the point.
      - name: Check the packages as a consumer
        run: node scripts/consumer-compat.mjs check dist/consumer

  # Derive the distinct published floors (each package's own floor raised to
  # its @composurecdk peers') from cdk-floors.json, so the enforce matrix stays
  # in sync without duplicating values in YAML and shards by what ships.
  cdk-floors-list:
    name: List CDK floors
    # Skipping this skips cdk-floors-enforce with it, via `needs`.
    if: ${{ !inputs.pre-deploy }}
    runs-on: ubuntu-latest
    outputs:
      floors: ${{ steps.read.outputs.floors }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Plain `node`, not the nx target: this job installs nothing, and `list`
      # needs only the manifest and the package.json peer graph.
      - name: Read distinct floors from manifest
        id: read
        run: node scripts/cdk-floors.mjs list

  # For each declared floor, pin aws-cdk-lib to it (npm overrides, clean install)
  # and run that floor's package group's unit suite against it. The suites
  # synthesise builders + policies via partial-matcher assertions, so this
  # catches both import-time (missing named export) and runtime (calling a
  # too-new method, e.g. the #146 Aspect call) version-gated APIs. One floor per
  # shard; the shard's fresh checkout is the clean tree the override needs.
  cdk-floors-enforce:
    name: Enforce aws-cdk-lib@${{ matrix.floor }}
    needs: cdk-floors-list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: false
      CDK_FLOORS_FLOOR: ${{ matrix.floor }}
    strategy:
      fail-fast: false
      matrix:
        floor: ${{ fromJSON(needs.cdk-floors-list.outputs.floors) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # No `npm ci` — enforce does the floor-pinned install itself, and the
      # fresh checkout is the clean tree the npm override requires. That is also
      # why this calls the script directly rather than `nx cdk-floors:enforce`:
      # nx cannot run before its own node_modules exist.
      - name: Enforce
        run: node scripts/cdk-floors.mjs enforce

  # The one check the `main` ruleset requires; see docs/ci.md#required-checks.
  # always() rather than !cancelled(): a cancelled run must fail this check,
  # because a required check that is skipped counts as passing.
  result:
    name: CI
    if: always()
    needs:
      - workflows
      - dependency-review
      - verify
      - package
      - consumer
      - cdk-floors-list
      - cdk-floors-enforce
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A job that CI needs failed or was cancelled; see the jobs above."
          exit 1
