name: Commits audit

# Checks that every commit pushed to main kept the agent attribution of the
# pull request it was squashed from. The PR policy **Commits** check runs before
# merge and cannot see the squash dialog, where the body is edited or emptied;
# this sees what landed. See docs/ci.md#auditing-main.
#
# Not part of ci.yml: the release gate needs CI green on the release commit,
# and a finding about an earlier commit must not block a release. A failure
# here marks the commit red and opens an issue instead.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Audit agent attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the commits
      pull-requests: read # find each commit's pull request and its commits
      issues: write # report a commit that lost its attribution
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Dependencies because the audit recognises agents by nx's own list, so it
      # agrees with the PR policy Commits check and with `nx release`.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit the pushed commits
        env:
          GH_TOKEN: ${{ github.token }}
          NX_DAEMON: false
        run: npx nx commits:audit
