name: Deploy Test

on:
  # The release gate. A release branch is the only ref holding exactly what
  # ships — version bumps and CHANGELOG.md included — so it is the only ref
  # worth deploying: `main`'s HEAD is a different tree, and tag time is too
  # late to gate anything. The result lands as a check on the release PR.
  #
  # Fires because release-prepare.yml pushes the branch authenticated with
  # RELEASE_PR_TOKEN; a push made with the default GITHUB_TOKEN would not
  # trigger it. See docs/ci.md#release_pr_token-required.
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for deployment test
        required: true
        default: sandbox
        type: choice
        options:
          - sandbox
  workflow_call:
    inputs:
      environment:
        description: Target environment for deployment test
        required: false
        default: sandbox
        type: string

permissions:
  contents: read
  id-token: write # Required for AWS OIDC

concurrency:
  # Shared with sandbox-cleanup.yml so a teardown can never run against the
  # sandbox account while a deploy is in flight (and vice versa). Keep this
  # group string identical in both workflows.
  group: sandbox-account-${{ inputs.environment || 'sandbox' }}
  cancel-in-progress: false # Never cancel in-flight deployments

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # A pre-deploy sanity check, not a second full CI run. The deploy runs on
    # Node 24 against the pinned aws-cdk-lib, so the other matrix legs (which
    # exist to prove dual ESM/CJS resolution across runtimes, ADR-0007) and the
    # floor shards (which pin aws-cdk-lib down to each package's declared
    # minimum, ADR-0008) cannot say anything about whether these stacks deploy.
    # The Node 24 leg still runs the whole verify chain — including `npm run
    # validate`, the synth + CloudFormation Validate pass that actually can.
    with:
      node-versions: "[24]"
      skip-cdk-floors: true

  deploy-test:
    name: Deploy and Verify Examples
    needs: ci
    runs-on: ubuntu-latest
    # Neptune DB instance provisioning alone is a >15 min long pole; 30 min
    # left too little slack for a clean deploy of the full example fleet.
    timeout-minutes: 45
    # Same fallback as the concurrency group above: a `push` event carries no
    # inputs, and losing the environment binding would silently drop the AWS
    # role and region vars with it.
    environment: ${{ inputs.environment || 'sandbox' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NX_DAEMON: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check for in-progress ComposureCDK stacks
        env:
          # Sandbox primary plus every region any example pins via
          # stack `env.region`. Keep in sync with SWEEP_REGIONS in
          # sandbox-cleanup.yml.
          CHECK_REGIONS: ${{ vars.AWS_REGION }} us-east-1
        run: |
          fail=0
          for region in $CHECK_REGIONS; do
            in_progress=$(aws cloudformation list-stacks --region "$region" \
              --stack-status-filter CREATE_IN_PROGRESS UPDATE_IN_PROGRESS DELETE_IN_PROGRESS UPDATE_ROLLBACK_IN_PROGRESS ROLLBACK_IN_PROGRESS REVIEW_IN_PROGRESS \
              --query "StackSummaries[?starts_with(StackName, 'ComposureCDK-')].StackName" \
              --output text)
            if [ -n "$in_progress" ]; then
              echo "::error::CloudFormation operations in progress in $region on ComposureCDK-* stacks: $in_progress"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Wait for sandbox-cleanup to complete or trigger it manually before retrying."
            exit 1
          fi

      - name: CDK Deploy
        working-directory: packages/examples
        run: npx cdk deploy --all --require-approval never --concurrency 5

      - name: Smoke Test
        working-directory: packages/examples
        run: node ../../scripts/smoke-test.mjs

      # Destroy runs in a separate sandbox-cleanup workflow (triggered by
      # workflow_run on this workflow, plus a nightly cron safety net). Keeping
      # destroy off the critical path lets developer feedback land in ~10 min
      # instead of waiting for CloudFront propagation during teardown.
