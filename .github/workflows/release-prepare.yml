name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: "Explicit version (e.g. 0.2.0). Leave blank for conventional-commits auto-detect."
        required: false
        type: string
      bump-peer-deps:
        description: "Rewrite @composurecdk/* peer-dep ranges before versioning. Required for 0.x minor bumps."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: read # release-gate.mjs lists CI's runs

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: false

    steps:
      - name: Validate inputs
        if: ${{ inputs.bump-peer-deps && inputs.specifier == '' }}
        run: |
          echo "::error::bump-peer-deps requires an explicit specifier (the new version to rewrite ranges to)."
          exit 1

      # Fails in seconds, before checkout. The CI half of the gate follows
      # checkout, since it runs the shared script.
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch release-prepare from main, not $REF."
            exit 1
          fi

      - name: Checkout
        # fetch-depth: 0 — nx release scans tags and conventional-commits history
        # since the previous release, so it needs the full git history.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deliberate: the release-branch push below authenticates with the credentials
          # checkout leaves in .git/config.
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

      # Versioning skips nx verify (see scripts/release-version.mjs); CI having
      # passed this commit stands in for it. The same check release-tag.yml
      # applies to the commit it tags.
      - name: Require green CI
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: node scripts/release-gate.mjs --sha="$SHA" --ci-only

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump @composurecdk/* peer-dep ranges
        # Rewrites ^0.X.0 ranges only — sufficient while the project is in 0.x.
        # Once we reach 1.x, peer-dep ranges become ^X.0.0 and this step is no
        # longer needed for minor bumps.
        if: ${{ inputs.bump-peer-deps }}
        # Inputs reach the shell through env, never `${{ }}` in the script, so a
        # crafted specifier cannot inject code.
        env:
          SPECIFIER: ${{ inputs.specifier }}
        run: |
          for f in packages/*/package.json; do
            sed -i 's|"@composurecdk/\([^"]*\)": "\^0\.[0-9]\+\.0"|"@composurecdk/\1": "^'"$SPECIFIER"'"|g' "$f"
          done

      - name: Version packages
        env:
          SPECIFIER: ${{ inputs.specifier }}
        run: npx nx release:version

      - name: Resolve new version
        id: version
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "branch=release/v${version}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx nx release changelog "$VERSION"

      - name: Create release branch and commit
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No changes produced by nx release. Nothing to release."
            exit 1
          fi
          git commit -m "chore(release): v${VERSION}"
          git push --force-with-lease origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            echo "PR already open for $BRANCH — branch was force-updated."
            gh pr view "$BRANCH" --json url --jq .url
            exit 0
          fi

          body=$(cat <<EOF
          Release **v${VERSION}**.

          Generated by \`release-prepare\` workflow run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          ## Merge checklist

          - [ ] CI is green
          - [ ] **Deploy Test** is green — it deploys this branch's examples to the sandbox and smoke-tests them
          - [ ] Changelog reads correctly
          - [ ] Version bumps match expectations

          Merging this PR is the release decision. Once CI passes the merge commit on \`main\`, the \`release-tag\` workflow pushes tag \`v${VERSION}\`, which triggers \`release.yml\` (GitHub Release → npm publish). The deploy is re-run only if \`main\` moved before the merge, so the commit differs from this branch.
          EOF
          )

          # Strip the YAML-imposed leading indentation from each line so the PR body
          # renders with no spurious indented-code blocks.
          body=$(printf '%s' "$body" | sed 's/^          //')

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v${VERSION}" \
            --body "$body"
