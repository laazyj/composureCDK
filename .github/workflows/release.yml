name: Release

on:
  push:
    # deploy-test gates the tag, in release-tag.yml — so a tag pushed by hand
    # skips it. See docs/ci.md#manual-fallback.
    tags:
      - "v*.*.*"

permissions:
  contents: write # Required for creating GitHub releases
  id-token: write # For npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # Create the GitHub Release
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NX_DAEMON: false

      # Created here rather than at tag time so the Release and the npm publish
      # land together — a Release always has packages behind it.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          # Notes are extracted from the workspace CHANGELOG.md section for this version.
          # The section header format is set by nx release: `## VERSION` followed by content
          # until the next `## ` heading.
          notes=$(awk -v ver="$version" '
            $0 ~ "^## "ver"( |$|\\()" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::warning::Could not extract notes for $tag from CHANGELOG.md; using auto-generated notes."
            gh release create "$tag" --title "$tag" --generate-notes
          else
            printf '%s' "$notes" | gh release create "$tag" --title "$tag" --notes-file -
          fi

      - name: Publish to npm
        run: npx nx release publish
        env:
          NPM_CONFIG_PROVENANCE: true
